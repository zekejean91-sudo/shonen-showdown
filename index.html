<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shonen Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6e0f2; --text: #2a1f3d; --btn: rgba(42,31,61,0.12); --btn-edge: rgba(42,31,61,0.35); --th: 0px;
    color-scheme: light; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #07050d; --text: #d8cff0; --btn: rgba(216,207,240,0.1); --btn-edge: rgba(216,207,240,0.3); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #07050d; --text: #d8cff0; --btn: rgba(216,207,240,0.1); --btn-edge: rgba(216,207,240,0.3); color-scheme: dark; }
  @media (pointer: coarse) { :root { --th: 150px; } }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: "Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
    display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  #wrap {
    width: min(100vw, calc((100vh - var(--th) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9));
    width: min(100vw, calc((100dvh - var(--th) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9));
    aspect-ratio: 16 / 9; background: #000; box-shadow: 0 0 0 4px #000, 0 12px 40px rgba(0,0,0,0.35);
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #touch { display: flex; justify-content: space-between; align-items: center; width: min(100vw, 680px); padding: 0 14px; height: 136px; }
  #touch[hidden] { display: none; }
  .pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 40px); gap: 4px; }
  .acts { display: grid; grid-template-columns: repeat(2, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; }
  .tb { font: inherit; font-size: 11px; color: var(--text); background: var(--btn); border: 2px solid var(--btn-edge); border-radius: 10px; padding: 0; touch-action: none; }
  .tb.on { background: var(--btn-edge); }
  .acts .tb { border-radius: 50%; }
  .tb.ult { color: #ff5fb0; border-color: #ff5fb0; }
</style>
</head>
<body>
<div id="app">
  <div id="wrap"><canvas id="game" aria-label="Shonen Showdown, a retro anime fighting game"></canvas></div>
  <div id="touch" hidden>
    <div class="pad">
      <span></span><button class="tb" data-k="T_up" aria-label="Jump">▲</button><span></span>
      <button class="tb" data-k="T_left" aria-label="Left">◀</button><span></span><button class="tb" data-k="T_right" aria-label="Right">▶</button>
      <span></span><button class="tb" data-k="T_down" aria-label="Crouch">▼</button><span></span>
    </div>
    <div class="acts">
      <button class="tb" data-k="T_p">PUNCH</button><button class="tb" data-k="T_k">KICK</button>
      <button class="tb" data-k="T_s">SPEC</button><button class="tb ult" data-k="T_u">METER</button>
    </div>
  </div>
</div>

  if (scr === 'title') drawTitle(); else if (scr === 'mode') drawMode(); else if (scr === 'help') drawHelp(); else if (scr === 'select') drawSelect();
  else if (scr === 'diff') drawDiff(); else if (scr === 'ladder') drawLadder(); else if (scr === 'continue') drawContinue(); else if (scr === 'ending') drawEnding(); else if (scr === 'name') drawName(); else if (scr === 'hiscores') drawHiscores(); else drawGame();
  screenT(); G.drawImage(scanCv, 0, 0);
  rand = simR;
}

// ====================== POINTER ======================
cv.addEventListener('pointerdown', e => {
  audio();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * SW, y = (e.clientY - r.top) / r.height * SH;
  if (['title', 'help', 'ladder', 'continue', 'ending', 'name', 'hiscores'].includes(scr)) pressed.add('T_tap');
  else if (scr === 'diff') { for (let i = 0; i < 4; i++) { const y0 = 80 + i * 56; if (x >= 120 && x <= 520 && y >= y0 && y <= y0 + 46) { diffIdx = i; pressed.add('T_tap'); } } }
  else if (scr === 'mode') { for (let i = 0; i < MENU.length; i++) { const b = menuBox(i); if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { menuIdx = i; pressed.add('T_tap'); } } }
  else if (scr === 'select' && mode !== '2p' && !sel.lock[0]) { for (let r = 0; r < ROWS.length; r++) for (let c = 0; c < ROWS[r].length; c++) { const b = tileRect(r, c); if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { const idx = ROWS[r][c]; if (sel.c[0] === idx) pressed.add('T_tap'); else { sel.c[0] = idx; SFX.select(); } } } }
  else if (scr === 'game' && phase === 'matchEnd') pressed.add('T_tap');
});

// ====================== LOOP ======================
buildStage(1);
let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame); if (!last) last = ts; acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000 / 60) {
    if (online && scr === 'game') { if (!netCanStep()) { acc = Math.min(acc, 1000 / 60 * 2); break; } netPrepStep(); step(); if (online) online.frame++; }
    else step();
    acc -= 1000 / 60;
  }
  netTick(); render();
}
const start = () => requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) { let started = false; const go = () => { if (!started) { started = true; start(); } }; document.fonts.load('16px "Press Start 2P"').then(go, go); setTimeout(go, 1500); } else start();
})();
</script>
